# ==========================================
# ECLAT Wedding Planning System
# ==========================================

spring.application.name=wedding-planning-system
server.port=8080

# Respect the external HTTPS host/protocol supplied by GitHub Codespaces proxy.
server.forward-headers-strategy=framework


# ==========================================
# JSP Configuration
# ==========================================

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# ==========================================
# Logging Configuration
# ==========================================

logging.level.com.wedding=INFO
logging.level.org.springframework.web=INFO


# ==========================================
# SMS / OTP Configuration
# ==========================================

eclat.sms.provider=${ECLAT_SMS_PROVIDER:console}


# ==========================================
# Notify.lk Configuration
# ==========================================

eclat.sms.notifylk.url=https://app.notify.lk/api/v1/send
eclat.sms.notifylk.user-id=${NOTIFYLK_USER_ID:}
eclat.sms.notifylk.api-key=${NOTIFYLK_API_KEY:}
eclat.sms.notifylk.sender-id=${NOTIFYLK_SENDER_ID:}

# Authentication throttling (in-memory; shared-store required for multi-instance deployments)
eclat.security.login.max-attempts=8
eclat.security.login.window-minutes=15

# Session cookie hardening. Set ECLAT_COOKIE_SECURE=true behind HTTPS in production.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${ECLAT_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Never enable the default demo administrator. Bootstrap only with explicit secrets.
# ECLAT_BOOTSTRAP_ADMIN_EMAIL / PASSWORD / NAME / PHONE are read from environment variables.


# ==========================================
# OTP Configuration
# ==========================================

eclat.otp.expiry-minutes=5
eclat.otp.max-attempts=5
eclat.otp.max-resends=3
eclat.otp.resend-cooldown-seconds=30

# Vendor portfolio photo uploads (maximum 5 MB per image)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=42MB
