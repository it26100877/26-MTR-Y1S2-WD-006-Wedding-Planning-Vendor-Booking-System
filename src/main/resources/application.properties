# ==========================================
# ECLAT Wedding Planning System
# ==========================================

spring.application.name=wedding-planning-system
server.port=8080


# ==========================================
# JSP Configuration
# ==========================================

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# ==========================================
# Logging Configuration
# ==========================================

logging.level.com.wedding=INFO
logging.level.org.springframework.web=INFO


# ==========================================
# SMS / OTP Configuration
# ==========================================

eclat.sms.provider=${ECLAT_SMS_PROVIDER:console}


# ==========================================
# Notify.lk Configuration
# ==========================================

eclat.sms.notifylk.url=https://app.notify.lk/api/v1/send

eclat.sms.notifylk.user-id=33597

# Paste your NEW 20-character API key here
eclat.sms.notifylk.api-key=${NOTIFYLK_API_KEY:}

eclat.sms.notifylk.sender-id=NotifyDEMO


# ==========================================
# OTP Configuration
# ==========================================

eclat.otp.expiry-minutes=5
eclat.otp.max-attempts=5
eclat.otp.max-resends=3
eclat.otp.resend-cooldown-seconds=30
