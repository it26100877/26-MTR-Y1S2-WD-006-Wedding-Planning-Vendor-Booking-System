<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Vendor Management</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f5fa;
            color: #302744;
        }

        header {
            background: #34264e;
            color: white;
            padding: 25px 5%;
        }

        header h1 { margin: 0 0 8px; }
        header p { margin: 0; color: #e4dcef; }

        main {
            max-width: 1250px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        .card, .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000008;
        }

        .card p { color: #777; margin: 0 0 10px; }
        .card h2 { color: #65469a; margin: 0; font-size: 28px; }

        .layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        h2 { font-size: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin: 13px 0 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd6e8;
            border-radius: 7px;
            background: white;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary { background: #65469a; color: white; }
        .secondary { background: #eee8f5; color: #483563; }
        .danger { background: #fde8e8; color: #a62929; }

        .form-buttons { display: flex; gap: 8px; margin-top: 18px; }
        .form-buttons button { flex: 1; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .toolbar h2 { margin-top: 0; }
        .toolbar input { max-width: 250px; }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 12px 9px;
            border-bottom: 1px solid #eeeaf3;
        }

        th { background: #faf9fc; color: #6c6378; }

        .actions { display: flex; gap: 5px; }
        .actions button { font-size: 12px; padding: 7px; }

        .status {
            background: #e2f6e9;
            color: #207443;
            border-radius: 20px;
            padding: 5px 8px;
        }

        .unavailable { background: #fff0d9; color: #89551a; }

        #message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
        }

        .success { display: block !important; background: #e2f6e9; color: #207443; }
        .error { display: block !important; background: #fde8e8; color: #a62929; }

        .empty { text-align: center; padding: 25px; color: #777; }

        footer { text-align: center; padding: 20px; color: #777; }

        @media (max-width: 850px) {
            .layout, .stats { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar input { max-width: none; }
        }
    </style>
</head>

<body>
<header>
    <h1>Wedding Vendor Management</h1>
    <p>Manage your wedding service providers in one place.</p>
</header>

<main>
    <div id="message" role="status"></div>

    <section class="stats">
        <div class="card">
            <p>Total Vendors</p>
            <h2 id="totalVendors">0</h2>
        </div>
        <div class="card">
            <p>Available Vendors</p>
            <h2 id="availableVendors">0</h2>
        </div>
        <div class="card">
            <p>Categories</p>
            <h2 id="totalCategories">0</h2>
        </div>
    </section>

    <section class="layout">
        <div class="panel">
            <h2 id="formTitle">Add a Vendor</h2>

            <form id="vendorForm">
                <label for="vendorId">Vendor ID</label>
                <input id="vendorId" required placeholder="e.g. V002">

                <label for="vendorName">Vendor Name</label>
                <input id="vendorName" required placeholder="Enter vendor name">

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option>Photography</option>
                    <option>Venue</option>
                    <option>Catering</option>
                    <option>Decoration</option>
                    <option>Music and DJ</option>
                    <option>Florist</option>
                    <option>Wedding Dress</option>
                    <option>Other</option>
                </select>

                <label for="contactNumber">Contact Number</label>
                <input id="contactNumber" required placeholder="0771234567">

                <label for="email">Email</label>
                <input id="email" type="email" required placeholder="vendor@email.com">

                <label for="price">Price (LKR)</label>
                <input id="price" type="number" min="0" step="0.01" required>

                <label for="availability">Availability</label>
                <select id="availability">
                    <option>Available</option>
                    <option>Unavailable</option>
                </select>

                <div class="form-buttons">
                    <button type="submit" class="primary" id="submitButton">
                        Add Vendor
                    </button>
                    <button type="button" class="secondary"
                            id="cancelButton" hidden>Cancel</button>
                </div>
            </form>
        </div>

        <div class="panel">
            <div class="toolbar">
                <h2>Vendor List</h2>
                <input id="searchInput" type="search" placeholder="Search vendors...">
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Vendor</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="vendorTable">
                    <tr><td colspan="6" class="empty">Loading vendors...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer>Wedding Planning &amp; Vendor Booking System</footer>

<script>
    const API_URL = "/api/vendors";
    let vendors = [];
    let editingId = null;

    const form = document.getElementById("vendorForm");
    const table = document.getElementById("vendorTable");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
        setTimeout(() => message.className = "", 4000);
    }

    async function request(url, options = {}) {
        const response = await fetch(url, options);

        if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `Request failed: ${response.status}`);
        }

        if (response.status === 204) return null;
        return response.json();
    }

    async function loadVendors() {
        try {
            vendors = await request(API_URL);
            renderVendors();
            updateStats();
        } catch (error) {
            table.innerHTML =
                '<tr><td colspan="6" class="empty">Could not load vendors. Check the backend.</td></tr>';
            showMessage(error.message, "error");
        }
    }

    function updateStats() {
        document.getElementById("totalVendors").textContent = vendors.length;

        document.getElementById("availableVendors").textContent =
            vendors.filter(v => v.availability === "Available").length;

        document.getElementById("totalCategories").textContent =
            new Set(vendors.map(v => v.category).filter(Boolean)).size;
    }

    function safe(value) {
        return String(value ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;",
            '"': "&quot;", "'": "&#39;"
        })[c]);
    }

    function renderVendors() {
        const term = document.getElementById("searchInput").value.toLowerCase();

        const list = vendors.filter(v =>
            [v.vendorId, v.vendorName, v.category, v.contactNumber]
                .some(value => String(value ?? "").toLowerCase().includes(term))
        );

        if (!list.length) {
            table.innerHTML =
                '<tr><td colspan="6" class="empty">No vendors found.</td></tr>';
            return;
        }

        table.innerHTML = list.map(v => `
            <tr>
                <td>${safe(v.vendorId)}</td>
                <td>${safe(v.vendorName)}</td>
                <td>${safe(v.category)}</td>
                <td>${Number(v.price).toLocaleString("en-LK")}</td>
                <td><span class="status ${v.availability === "Available" ? "" : "unavailable"}">
                    ${safe(v.availability)}
                </span></td>
                <td><div class="actions">
                    <button class="secondary" data-edit="${safe(v.vendorId)}">Edit</button>
                    <button class="danger" data-delete="${safe(v.vendorId)}">Delete</button>
                </div></td>
            </tr>
        `).join("");
    }

    function resetForm() {
        form.reset();
        editingId = null;
        document.getElementById("vendorId").disabled = false;
        document.getElementById("formTitle").textContent = "Add a Vendor";
        document.getElementById("submitButton").textContent = "Add Vendor";
        document.getElementById("cancelButton").hidden = true;
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const vendor = {
            vendorId: document.getElementById("vendorId").value.trim(),
            vendorName: document.getElementById("vendorName").value.trim(),
            category: document.getElementById("category").value,
            contactNumber: document.getElementById("contactNumber").value.trim(),
            email: document.getElementById("email").value.trim(),
            price: Number(document.getElementById("price").value),
            availability: document.getElementById("availability").value
        };

        if (!Number.isFinite(vendor.price) || vendor.price < 0) {
            showMessage("Please enter a valid price.", "error");
            return;
        }

        try {
            if (editingId !== null) {
                await request(`${API_URL}/${encodeURIComponent(editingId)}`, {
                    method: "PUT",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(vendor)
                });
                showMessage("Vendor updated successfully!", "success");
            } else {
                await request(API_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(vendor)
                });
                showMessage("Vendor added successfully!", "success");
            }

            resetForm();
            await loadVendors();
        } catch (error) {
            showMessage(error.message, "error");
        }
    });

    table.addEventListener("click", async event => {
        const edit = event.target.closest("[data-edit]");
        const del = event.target.closest("[data-delete]");

        if (edit) {
            const v = vendors.find(x => x.vendorId === edit.dataset.edit);
            if (!v) return;

            editingId = v.vendorId;
            document.getElementById("vendorId").value = v.vendorId;
            document.getElementById("vendorId").disabled = true;
            document.getElementById("vendorName").value = v.vendorName ?? "";
            document.getElementById("category").value = v.category ?? "";
            document.getElementById("contactNumber").value = v.contactNumber ?? "";
            document.getElementById("email").value = v.email ?? "";
            document.getElementById("price").value = v.price ?? 0;
            document.getElementById("availability").value = v.availability ?? "Available";
            document.getElementById("formTitle").textContent = "Edit Vendor";
            document.getElementById("submitButton").textContent = "Save Changes";
            document.getElementById("cancelButton").hidden = false;
            form.scrollIntoView({behavior: "smooth"});
        }

        if (del) {
            const id = del.dataset.delete;
            if (!confirm(`Delete vendor ${id}?`)) return;

            try {
                await request(`${API_URL}/${encodeURIComponent(id)}`, {
                    method: "DELETE"
                });
                showMessage("Vendor deleted successfully!", "success");
                if (editingId === id) resetForm();
                await loadVendors();
            } catch (error) {
                showMessage(error.message, "error");
            }
        }
    });

    document.getElementById("cancelButton").addEventListener("click", resetForm);
    document.getElementById("searchInput").addEventListener("input", renderVendors);

    loadVendors();
</script>
</body>
</html>
